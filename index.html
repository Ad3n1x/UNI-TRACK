<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3b82f6" />

    <!-- Self-Referencing Canonical Tag -->
    <link rel="canonical" href="https://unitrack-app.vercel.app" />

    <!-- Primary SEO Meta Tags -->
    <title>UNITRACK – Smart End-to-End Encrypted Tracking System</title>
    <meta
      name="description"
      content="UNITRACK (UniTrack) is a fast, private, end-to-end encrypted tracking system for managing daily tasks, habits, and productivity metrics."
    />
    <meta
      name="keywords"
      content="UNITRACK, UniTrack, unitrack, uni-track, tracking app, task tracker, secure tracker, E2EE productivity app"
    />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:title" content="UNITRACK – Smart Tracking System" />
    <meta
      property="og:description"
      content="Manage your daily tasks and metrics securely with client-side end-to-end encryption."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://unitrack-app.vercel.app" />

    <!-- Bootstrap CSS (v5.3.3) -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />

    <!-- Font Awesome Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- ALAT Pay Inline Popup SDK -->
    <script src="https://web.alatpay.ng/js/alatpay.js"></script>
  </head>

  <body>
    <div id="root">
      <!-- Fallback H1 for SEO Crawlers before JavaScript hydration -->
      <h1 class="visually-hidden">UNITRACK – Smart End-to-End Encrypted Tracking System</h1>
    </div>

    <!-- React Application Root -->
    <script type="module" src="/src/main.jsx"></script>

    <!-- Bootstrap JS Bundle -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
